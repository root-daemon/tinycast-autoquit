name: Hosted Harness Diagnostics
run-name: Hosted harness diagnostics
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [stable, beta]
        default: stable
      version:
        type: string
        required: true
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        harness: [mcp-oauth-test, ext-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run isolated harness
        env:
          HARNESS: ${{ matrix.harness }}
        run: ./Scripts/run-tests.sh "$HARNESS"
