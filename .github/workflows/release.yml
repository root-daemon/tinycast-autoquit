name: Release
run-name: "Tinycast ${{ inputs.version }} · ${{ inputs.channel }}"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, beta]
        default: stable
      version:
        description: Base version, for example 0.11.5
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.channel }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
      - name: Run harnesses
        env:
          TINYCAST_TEST_JOBS: 2
        run: ./Scripts/run-tests.sh
      - name: Debug build
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DebugDerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Lint and model purity
        run: |
          command -v swiftlint || brew install swiftlint
          ./Scripts/lint.sh
          if rg -l 'import AppKit|import SwiftUI|import Cocoa' Tinycast/Features/*/Model/; then exit 1; fi

  build:
    needs: validate
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, universal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release metadata
        env:
          BASE_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          if [ "$CHANNEL" = beta ]; then
            VERSION="${BASE_VERSION}-beta.${GITHUB_RUN_NUMBER}"
            DISPLAY_NAME="Tinycast Beta"
            BUNDLE_ID="com.tinycast.app.beta"
          else
            VERSION="$BASE_VERSION"
            DISPLAY_NAME="Tinycast"
            BUNDLE_ID="com.tinycast.app"
          fi
          if [ "$ARCHITECTURE" = universal ]; then
            ARCHS="arm64 x86_64"
            FILE_PREFIX="Tinycast-Universal"
          else
            ARCHS="arm64"
            FILE_PREFIX="Tinycast"
          fi
          {
            echo "VERSION=$VERSION"
            echo "DISPLAY_NAME=$DISPLAY_NAME"
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "ARCHS=$ARCHS"
            echo "FILE_PREFIX=$FILE_PREFIX"
          } >> "$GITHUB_ENV"
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          test -n "$P12_BASE64" && test -n "$P12_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/"Tinycast Self-Signed"/ {print $2; exit}')"
          test -n "$IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/identity.p12"
      - name: Build signed app
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="$ARCHS" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS=--timestamp=none \
            PRODUCT_NAME="$DISPLAY_NAME" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
      - name: Verify signature and architectures
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          ./Scripts/verify-signature.sh "$APP"
          for BIN in "$APP/Contents/MacOS/$DISPLAY_NAME" "$APP/Contents/Helpers/ClipboardTextHelper"; do
            if [ "$ARCHS" = arm64 ]; then
              test "$(lipo -archs "$BIN")" = arm64
            else
              lipo "$BIN" -verify_arch arm64 x86_64
              test "$(lipo -archs "$BIN" | wc -w | tr -d ' ')" = 2
            fi
          done
      - name: Package and verify DMG and ZIP
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE" dist
          ditto "$APP" "$STAGE/${DISPLAY_NAME}.app"
          ln -s /Applications "$STAGE/Applications"
          diskutil image create from "$STAGE" --format UDZO --volumeName "$DISPLAY_NAME" "dist/${FILE_PREFIX}-${VERSION}.dmg"
          hdiutil verify "dist/${FILE_PREFIX}-${VERSION}.dmg"
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/${FILE_PREFIX}-${VERSION}.zip"
          ditto -x -k "dist/${FILE_PREFIX}-${VERSION}.zip" "$RUNNER_TEMP/zip-check"
          ./Scripts/verify-signature.sh "$RUNNER_TEMP/zip-check/${DISPLAY_NAME}.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.architecture }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/
      - name: Release metadata
        env:
          BASE_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = beta ]; then
            VERSION="${BASE_VERSION}-beta.${GITHUB_RUN_NUMBER}"
            DISPLAY_NAME="Tinycast Beta"
            BUNDLE_ID="com.tinycast.app.beta"
          else
            VERSION="$BASE_VERSION"
            DISPLAY_NAME="Tinycast"
            BUNDLE_ID="com.tinycast.app"
          fi
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
            echo "DISPLAY_NAME=$DISPLAY_NAME"
            echo "BUNDLE_ID=$BUNDLE_ID"
          } >> "$GITHUB_ENV"
      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
          SHA: ${{ github.sha }}
        run: ./Scripts/release-notes.sh "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/changelog.md"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          test "$(find dist -type f | wc -l | tr -d ' ')" = 4
          (cd dist && sha256sum ./*.dmg ./*.zip > SHA256SUMS)
          FLAGS=()
          if [ "$CHANNEL" = beta ]; then FLAGS+=(--prerelease); fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; use a new version."
            exit 1
          fi
          gh release create "$TAG" dist/* --draft --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$DISPLAY_NAME $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${FLAGS[@]}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
